<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مَدى Go - Pitch Deck</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap');
  
  :root {
    --primary-maroon: #7A001E;
    --gold-accent: #D4AF37;
    --dark-bg: #0F0508;
    --card-bg: #1E0A12;
    --light-gold: rgba(212, 175, 55, 0.15);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Noto Sans Arabic', system-ui, sans-serif;
    background: var(--dark-bg);
    color: #fff;
    height: 100vh;
    overflow: hidden;
    direction: rtl;
  }
  
  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  
  .bg-gradient {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 20%, #3B000E 0%, var(--dark-bg) 70%);
    z-index: 0;
    pointer-events: none;
  }
  
  .header {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.1);
  }
  
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .brand-icon {
    width: 40px; height: 40px;
    background: var(--primary-maroon);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(212, 175, 55, 0.4);
  }
  
  .brand-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
  .brand-text span { font-size: 10px; color: var(--gold-accent); font-weight: 600; }
  
  .slide-counter {
    background: rgba(255,255,255,0.05);
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 13px;
    color: rgba(255,255,255,0.7);
  }
  
  .slide-container {
    flex: 1;
    position: relative;
    z-index: 5;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
  }
  
  .slides-wrapper {
    display: flex;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    width: 100%;
    height: 100%;
  }
  
  .slide {
    min-width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 0;
  }
  
  .slide-card {
    background: rgba(30, 10, 18, 0.95);
    border: 1.5px solid rgba(212, 175, 55, 0.25);
    border-radius: 20px;
    padding: 28px;
    width: 100%;
    max-width: 720px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 0 40px rgba(122, 0, 30, 0.3), inset 0 1px 0 rgba(212, 175, 55, 0.1);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  
  .slide-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  
  .slide-icon-wrap {
    width: 48px; height: 48px;
    background: rgba(122, 0, 30, 0.5);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(212, 175, 55, 0.2);
    flex-shrink: 0;
  }
  
  .slide-title-group { flex: 1; }
  .slide-title-group h2 { font-size: 20px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
  .slide-title-group p { font-size: 13px; color: var(--gold-accent); font-weight: 500; }
  
  .badge {
    background: var(--gold-accent);
    color: var(--dark-bg);
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  
  .points-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }
  
  .point-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: all 0.2s ease;
  }
  
  .point-item:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(212, 175, 55, 0.15);
  }
  
  .point-icon {
    width: 40px; height: 40px;
    background: rgba(122, 0, 30, 0.4);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(212, 175, 55, 0.2);
    flex-shrink: 0;
  }
  
  .point-body { flex: 1; }
  .point-body h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .point-body p { font-size: 12.5px; color: rgba(255,255,255,0.65); line-height: 1.5; }
  
  .metric {
    background: var(--primary-maroon);
    border: 1px solid var(--gold-accent);
    color: var(--gold-accent);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    flex-shrink: 0;
  }
  
  .footer {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 24px 20px;
    gap: 16px;
  }
  
  .nav-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  
  .nav-btn.prev {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }
  .nav-btn.prev:hover:not(:disabled) { background: rgba(255,255,255,0.15); }
  .nav-btn.prev:disabled { opacity: 0.3; cursor: not-allowed; }
  
  .nav-btn.next {
    background: var(--gold-accent);
    color: var(--dark-bg);
  }
  .nav-btn.next:hover:not(:disabled) { background: #e5c04a; }
  .nav-btn.next:disabled { opacity: 0.4; cursor: not-allowed; }
  
  .dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  
  .dot {
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.2);
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .dot.active { width: 20px; background: var(--gold-accent); }
  .dot:not(.active) { width: 6px; }
  
  @media (max-width: 640px) {
    .slide-card { padding: 18px; max-height: 78vh; }
    .slide-title-group h2 { font-size: 16px; }
    .point-item { padding: 12px; }
    .header { padding: 12px 16px; }
    .footer { padding: 10px 16px 16px; }
  }
  
  .fade-in {
    animation: fadeIn 0.4s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

    <div class="slides-wrapper" id="wrapper">

    </div>
  </div>
